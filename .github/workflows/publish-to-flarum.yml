name: Publicar Release no Flarum

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish_to_flarum:
    name: Publicar no Fórum
    runs-on: ubuntu-latest
    steps:
      - name: Publicar discussão no Flarum
        env:
          FLARUM_API_KEY: ${{ secrets.FLARUM_API_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          # Build the JSON payload using jq to safely handle special characters
          PAYLOAD=$(jq -n \
            --arg title "🚀 $RELEASE_TAG — Tema Avocado" \
            --arg content "$RELEASE_BODY" \
            '{
              "data": {
                "type": "discussions",
                "attributes": {
                  "title": $title,
                  "content": $content
                }
              }
            }')

          HTTP_STATUS=$(curl -s -o /tmp/flarum_response.json -w "%{http_code}" \
            -X POST "https://ramonguilherme.com.br/api/discussions" \
            -H "Authorization: Token ${FLARUM_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Discussão criada com sucesso no Flarum!"
            jq '.data.id // empty' /tmp/flarum_response.json
          else
            echo "❌ Falha ao criar discussão no Flarum (HTTP $HTTP_STATUS)"
            echo "Response body:"
            jq '.' /tmp/flarum_response.json
            exit 1
          fi

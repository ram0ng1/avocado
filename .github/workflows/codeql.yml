name: CodeQL

# §35.13 I2 — CodeQL (JS/TS). PHP não é suportado pelo CodeQL; cobertura
# PHP é feita por PHPStan (§35.13 R3) no ci.yml e Semgrep (security.yml).
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 6 * * 1'  # toda segunda, 06:00 UTC

# §35.13 C1 — default-deny.
permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analisar (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@a65a038433a26f4363cf9f029e3b9ceac831ad5d  # v3.28.10
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Analisar
        uses: github/codeql-action/analyze@a65a038433a26f4363cf9f029e3b9ceac831ad5d  # v3.28.10
        with:
          category: "/language:${{ matrix.language }}"

name: Sincronizar Branches com Master

on:
  push:
    branches:
      - master
  workflow_dispatch:

# §35.13 C1 — default-deny.
permissions: {}

concurrency:
  group: sync-branches
  cancel-in-progress: false

jobs:
  sync:
    name: Sincronizar branches com master
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sincronizar branches com master
        run: |
          git fetch --all

          BRANCHES=$(git branch -r \
            | grep -v 'HEAD' \
            | grep -v 'origin/master' \
            | grep -v 'origin/copilot/' \
            | grep -v 'origin/dependabot/' \
            | grep -v 'origin/claude/' \
            | sed 's|origin/||' \
            | tr -d ' ')

          for branch in $BRANCHES; do
            echo "▶ Sincronizando branch: $branch"

            git checkout -B "$branch" "origin/$branch"

            if ! git merge-base origin/master "origin/$branch" >/dev/null 2>&1; then
              echo "⚠️  '$branch' não compartilha histórico com master (pré-reescrita) — pulando"
              continue
            fi

            if git merge origin/master --no-edit -m "chore: sync with master"; then
              git push origin "$branch"
              echo "✅ Branch '$branch' sincronizada com sucesso"
            else
              echo "⚠️  Conflito ao sincronizar '$branch' com master — pulando"
              git merge --abort 2>/dev/null || true
            fi
          done

name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  # Segunda 05:00 UTC: roda a CI mesmo sem push. Como os jobs resolvem as
  # dependências com `composer update`, o agendamento testa automaticamente
  # contra a versão mais nova do flarum/core e detecta quebras trazidas por
  # novas versões do Flarum antes que cheguem a você.
  schedule:
    - cron: '0 5 * * 1'

# Default-deny do GITHUB_TOKEN (CLAUDE.md §35.13 C1). Jobs declaram o
# que precisam.
permissions: {}

# Evita corridas redundantes no mesmo PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Valida o composer.json as-committed (antes de qualquer mutacao por
  # matriz). --strict reprova constraints exatas; por isso este passo
  # tem que rodar fora da matriz que pin a flarum/core em 2.x-dev.
  composer-validate:
    name: composer validate (--strict)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 🟡 §35.13/I3 — egress em `audit` (fase 1: registra os destinos, não
      # bloqueia). A allowed-endpoints abaixo é a lista candidata para quando
      # promover a `block` — antes, revise o resumo do harden-runner do run e
      # ajuste-a aos destinos reais.
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            packagist.org:443
            repo.packagist.org:443
            getcomposer.org:443
            registry.npmjs.org:443
            nodejs.org:443
            ppa.launchpadcontent.net:443
            ppa.launchpadcontent.net:80
            keyserver.ubuntu.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            pecl.php.net:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validar composer.json
        # O composer.json NÃO tem campo "version": a versão dos releases é
        # derivada das tags git (ver release-management.yml). --no-check-publish
        # evita falso-positivo de requisitos de publicação; demais warnings
        # continuam fatais.
        run: composer validate --strict --no-check-publish

  php:
    name: PHP ${{ matrix.php }} × flarum/core ${{ matrix.flarum-core }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # flarum/core 2.x requer php ^8.3 — 8.2 ficou de fora. 8.5 incluído
        # (testado localmente); o composer update usa --ignore-platform-req=php+
        # para o caso de uma dependência ainda não declarar suporte a 8.5.
        php: ['8.3', '8.4', '8.5']
        # §35.13 I5 — testa contra a versão estável E a HEAD do core.
        flarum-core:
          - '^2.0.0'
          - '2.x-dev'
    # Service containers para a suíte de integração cross-engine. Sem eles, os
    # data sets mysql/pgsql do DiscussionHeroTest apenas pulam (sqlite sempre roda).
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: avocado_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avocado_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      # 🟡 §35.13/I3 — egress em `audit` (fase 1: registra os destinos, não
      # bloqueia). A allowed-endpoints abaixo é a lista candidata para quando
      # promover a `block` — antes, revise o resumo do harden-runner do run e
      # ajuste-a aos destinos reais.
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            packagist.org:443
            repo.packagist.org:443
            getcomposer.org:443
            registry.npmjs.org:443
            nodejs.org:443
            ppa.launchpadcontent.net:443
            ppa.launchpadcontent.net:80
            keyserver.ubuntu.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            pecl.php.net:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: ${{ matrix.php }}
          # sqlite/mysql/pgsql = suíte de integração cross-engine; dom/mbstring/fileinfo = sanitizers + uploads.
          extensions: dom, mbstring, fileinfo, pdo_sqlite, sqlite3, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Pin flarum/core para a célula da matriz
        run: composer require --no-update "flarum/core:${{ matrix.flarum-core }}"

      - name: Resolver dependências (composer update)
        # --ignore-platform-req=php+ ignora apenas o LIMITE SUPERIOR de PHP (para
        # a célula 8.5, caso uma dependência ainda não declare suporte); não
        # mascara extensões faltantes nem o limite inferior.
        run: composer update --no-interaction --no-progress --prefer-stable --no-scripts --ignore-platform-req=php+

      # Suítes rodam em steps separados para aparecerem como linhas distintas na
      # UI do Actions (Unit / Locale parity / Integration cross-engine).
      - name: Unit tests (sanitizers, policy, CSS-injection)
        run: vendor/bin/phpunit --testsuite unit

      # Um step por engine → 3 linhas distintas na UI do Actions. Usamos a sintaxe
      # de data set do PHPUnit (--filter '#nome'): o bare `--filter sqlite` casa o
      # nome do método/conjunto no PHPUnit 11 mas NÃO no 13 (que então reporta
      # "No tests executed" e sai com código 1). O prefixo '#' filtra pelo nome do
      # data set (sqlite/mysql/pgsql) do DiscussionHeroTest em ambas as versões.
      - name: Integration — SQLite
        run: vendor/bin/phpunit --testsuite integration --filter '#sqlite'

      - name: Integration — MySQL
        env:
          AVOCADO_TEST_MYSQL: host=127.0.0.1;port=3306;username=root;password=root;database=avocado_test
        run: vendor/bin/phpunit --testsuite integration --filter '#mysql'

      - name: Integration — PgSQL
        env:
          AVOCADO_TEST_PGSQL: host=127.0.0.1;port=5432;username=postgres;password=postgres;database=avocado_test
        run: vendor/bin/phpunit --testsuite integration --filter '#pgsql'

      - name: Lint PHP (php -l)
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find src migrations extend.php -name '*.php' -print0 2>/dev/null)
          [ "${#files[@]}" -gt 0 ] || { echo "Nenhum arquivo PHP encontrado"; exit 1; }
          printf '%s\0' "${files[@]}" | xargs -0 -n1 -P4 php -l

      # §35.13 R2 — Packagist security advisories.
      - name: composer audit
        run: composer audit --no-dev --format=plain

      # §35.13 R3 — PHPStan nível 5 com baseline versionado (phpstan.neon +
      # phpstan-baseline.neon). phpstan/phpstan já vem via require-dev, então
      # `composer analyse` basta. Bloqueante: o baseline mantém verde e novos
      # achados reprovam o PR (aperte o nível/baseline com o tempo).
      - name: PHPStan
        if: matrix.php == '8.3' && matrix.flarum-core == '^2.0.0'
        run: composer analyse

  js:
    name: JS (typecheck, format, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 🟡 §35.13/I3 — egress em `audit` (fase 1: registra os destinos, não
      # bloqueia). A allowed-endpoints abaixo é a lista candidata para quando
      # promover a `block` — antes, revise o resumo do harden-runner do run e
      # ajuste-a aos destinos reais.
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            packagist.org:443
            repo.packagist.org:443
            getcomposer.org:443
            registry.npmjs.org:443
            nodejs.org:443
            ppa.launchpadcontent.net:443
            ppa.launchpadcontent.net:80
            keyserver.ubuntu.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            pecl.php.net:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Composer + PHP necessários para resolver os typings do core
      # (js/tsconfig importa flarum/* via ../vendor/flarum/core/js/dist-typings/*).
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache do composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Instalar dependências PHP (para os typings do core)
        # composer update (em vez de install) porque a extensão é uma
        # lib e mantém composer.lock no .gitignore.
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: js/package-lock.json

      - name: Instalar dependências JS
        working-directory: js
        run: npm ci

      - name: Verificar formatação (Prettier)
        working-directory: js
        run: npm run format-check

      - name: Type-check (TypeScript)
        working-directory: js
        run: npm run check-typings

      # Step próprio para aparecer como linha distinta na UI: roda a regra
      # i18n/no-hardcoded-text (strings hardcoded) + mithril-key + jsx-key.
      - name: ESLint (regra i18n + mithril keys)
        working-directory: js
        run: npm run lint

      # Webpack puro — o lint já rodou no step acima (build npm-script reexecuta
      # o lint; aqui chamamos o webpack direto para não duplicar).
      - name: Build (webpack production)
        working-directory: js
        run: node_modules/.bin/webpack --mode production

      # §35.13 R2 — npm advisories. --audit-level=high reduz ruído de
      # transitivas dev; subir para moderate quando o baseline estabilizar.
      - name: npm audit
        working-directory: js
        run: npm audit --audit-level=high

  # Paridade de tradução (en ↔ pt-BR) roda UMA vez em job próprio — independe de
  # versão de PHP/core, então não precisa repetir nas 6 células da matriz `php`.
  # Vira um box distinto na UI do Actions.
  locale:
    name: Locale parity (i18n keys)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring
          coverage: none
          tools: composer:v2

      - name: Resolver dependências (composer update)
        run: composer update --no-interaction --no-progress --prefer-stable --no-scripts

      - name: Locale parity (chaves i18n en ↔ pt-BR)
        run: vendor/bin/phpunit --testsuite locale

  # §35.13 I1 — bloqueia PRs que introduzam dependências com CVEs conhecidos.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      # 🟡 §35.13/I3 — egress em `audit` (fase 1: registra os destinos, não
      # bloqueia). A allowed-endpoints abaixo é a lista candidata para quando
      # promover a `block` — antes, revise o resumo do harden-runner do run e
      # ajuste-a aos destinos reais.
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            packagist.org:443
            repo.packagist.org:443
            getcomposer.org:443
            registry.npmjs.org:443
            nodejs.org:443
            ppa.launchpadcontent.net:443
            ppa.launchpadcontent.net:80
            keyserver.ubuntu.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            pecl.php.net:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

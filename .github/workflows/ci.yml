name: CI

# O que é só do tema: PHP (testes, lint, PHPStan, auditoria) numa matriz de
# versões e do flarum/core, migrações em MySQL/PostgreSQL, JS (Prettier,
# TypeScript, ESLint, build) e paridade das traduções. A integração com
# flarum/testing roda no backend.yml.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  # Segunda 05:00 UTC: roda mesmo sem push. Como as dependências vêm de
  # `composer update`, isso testa contra o flarum/core mais novo e pega
  # quebras de uma versão nova do Flarum antes de chegarem ao fórum.
  schedule:
    - cron: '0 5 * * 1'

# Nega tudo ao GITHUB_TOKEN por padrão; cada job declara o que precisa.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Valida o composer.json como está no repositório (antes de a matriz mexer
  # na versão do core).
  composer-validate:
    name: composer validate (--strict)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validar composer.json
        # Sem campo "version": as versões vêm das tags do git.
        run: composer validate --strict --no-check-publish

  php:
    name: PHP ${{ matrix.php }} × flarum/core ${{ matrix.flarum-core }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # O flarum/core 2.x exige PHP ^8.3. O fórum de desenvolvimento roda 8.5.
        php: ['8.3', '8.4', '8.5']
        # A versão estável E a ponta do core.
        flarum-core:
          - '^2.0.0'
          - '2.x-dev'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, fileinfo, gd, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Fixar o flarum/core desta célula
        run: composer require --no-update "flarum/core:${{ matrix.flarum-core }}"

      - name: Resolver dependências (composer update)
        # --ignore-platform-req=php+ ignora só o limite SUPERIOR de PHP (para a
        # célula 8.5, se alguma dependência ainda não declarar suporte).
        run: composer update --no-interaction --no-progress --prefer-stable --no-scripts --ignore-platform-req=php+

      - name: Testes unitários (carregador de recursos)
        run: vendor/bin/phpunit -c tests/phpunit.unit.xml --testsuite unit

      - name: Lint PHP (php -l)
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find src migrations extend.php tests -name '*.php' -print0 2>/dev/null)
          [ "${#files[@]}" -gt 0 ] || { echo "Nenhum arquivo PHP encontrado"; exit 1; }
          printf '%s\0' "${files[@]}" | xargs -0 -n1 -P4 php -l

      - name: composer audit
        run: composer audit --no-dev --format=plain

      # PHPStan nível 6 com a extensão do Flarum (flarum/phpstan), sem
      # baseline: o mesmo padrão do core e da FoF.
      - name: PHPStan
        if: matrix.php == '8.3' && matrix.flarum-core == '^2.0.0'
        run: composer analyse:phpstan

  # A migração do hero move dados entre tabelas: roda contra cada banco de
  # verdade (tests/unit/Migrations), em tabelas próprias.
  migrations:
    name: Migrações × ${{ matrix.engine }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: mysql
            env-name: AVOCADO_TEST_MYSQL
            dsn: host=127.0.0.1;port=3306;username=root;password=root;database=avocado_test
          - engine: mariadb
            env-name: AVOCADO_TEST_MARIADB
            dsn: host=127.0.0.1;port=3307;username=root;password=root;database=avocado_test
          - engine: pgsql
            env-name: AVOCADO_TEST_PGSQL
            dsn: host=127.0.0.1;port=5432;username=postgres;password=postgres;database=avocado_test
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: avocado_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: avocado_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avocado_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, fileinfo, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Resolver dependências (composer update)
        run: composer update --no-interaction --no-progress --prefer-stable --no-scripts

      # `@engine` filtra pelo nome do data set; vazio ou pulado é falha (banco
      # fora do ar ou filtro errado não pode passar em silêncio).
      - name: Migração do hero
        env:
          ENGINE_ENV: ${{ matrix.env-name }}
          ENGINE_DSN: ${{ matrix.dsn }}
          ENGINE: ${{ matrix.engine }}
        run: env "$ENGINE_ENV=$ENGINE_DSN" vendor/bin/phpunit -c tests/phpunit.unit.xml --testsuite unit --filter "@$ENGINE" --fail-on-empty-test-suite --fail-on-skipped

  js:
    name: JS (formatação, tipos, lint, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # O tsconfig lê os typings do core em ../vendor/flarum/core/js/dist-typings.
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache do composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Dependências PHP (para os typings do core)
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: js/package-lock.json

      - name: Dependências JS
        working-directory: js
        run: npm ci

      - name: Formatação (Prettier)
        working-directory: js
        run: npm run format-check

      - name: Tipos (TypeScript)
        working-directory: js
        run: npm run check-typings

      # Chaves do Mithril (irmãos com e sem key quebram a reconciliação) e
      # texto fixo na interface (tudo passa pelo tradutor).
      - name: ESLint (mithril-key + i18n)
        working-directory: js
        run: npm run lint

      - name: Build (webpack production)
        working-directory: js
        run: node_modules/.bin/webpack --mode production

      # Todo o node_modules é de build: o pacote publicado é js/dist/*.js.
      # Bloqueia só o que chegaria à produção; o resto fica visível no log.
      - name: npm audit (produção — bloqueia)
        working-directory: js
        run: npm audit --audit-level=high --omit=dev

      - name: npm audit (dev — informativo)
        working-directory: js
        continue-on-error: true
        run: npm audit --audit-level=high

  # Paridade das traduções (en ↔ pt-BR): não depende da versão do PHP/core.
  locale:
    name: Paridade das traduções
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring
          coverage: none
          tools: composer:v2

      - name: Resolver dependências (composer update)
        run: composer update --no-interaction --no-progress --prefer-stable --no-scripts

      - name: Chaves en ↔ pt-BR
        run: vendor/bin/phpunit -c tests/phpunit.unit.xml --testsuite locale

  # Reprova PRs que tragam dependências com vulnerabilidade conhecida. Só em
  # repositório público: no privado a ação exige o GitHub Advanced Security
  # (lá o `composer audit` da matriz já cobre as dependências PHP).
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !github.event.repository.private
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

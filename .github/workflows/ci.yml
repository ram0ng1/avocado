name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Default-deny do GITHUB_TOKEN (CLAUDE.md §35.13 C1). Jobs declaram o
# que precisam.
permissions: {}

# Evita corridas redundantes no mesmo PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Valida o composer.json as-committed (antes de qualquer mutacao por
  # matriz). --strict reprova constraints exatas; por isso este passo
  # tem que rodar fora da matriz que pin a flarum/core em 2.x-dev.
  composer-validate:
    name: composer validate (--strict)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 🟡 §35.13/I3 — egress em `audit` (fase 1: registra os destinos, não
      # bloqueia). A allowed-endpoints abaixo é a lista candidata para quando
      # promover a `block` — antes, revise o resumo do harden-runner do run e
      # ajuste-a aos destinos reais.
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5  # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            packagist.org:443
            repo.packagist.org:443
            getcomposer.org:443
            registry.npmjs.org:443
            nodejs.org:443
            ppa.launchpadcontent.net:443
            ppa.launchpadcontent.net:80
            keyserver.ubuntu.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            pecl.php.net:443

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f  # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validar composer.json
        # O composer.json NÃO tem campo "version": a versão dos releases é
        # derivada das tags git (ver release-management.yml). --no-check-publish
        # evita falso-positivo de requisitos de publicação; demais warnings
        # continuam fatais.
        run: composer validate --strict --no-check-publish

  php:
    name: PHP ${{ matrix.php }} × flarum/core ${{ matrix.flarum-core }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # flarum/core 2.x requer php ^8.3 — 8.2 ficou de fora.
        php: ['8.3', '8.4']
        # §35.13 I5 — testa contra a versão estável E a HEAD do core.
        flarum-core:
          - '^2.0.0'
          - '2.x-dev'
    # Service containers para a suíte de integração cross-engine. Sem eles, os
    # data sets mysql/pgsql do DiscussionHeroTest apenas pulam (sqlite sempre roda).
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: avocado_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avocado_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      # 🟡 §35.13/I3 — egress em `audit` (fase 1: registra os destinos, não
      # bloqueia). A allowed-endpoints abaixo é a lista candidata para quando
      # promover a `block` — antes, revise o resumo do harden-runner do run e
      # ajuste-a aos destinos reais.
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5  # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            packagist.org:443
            repo.packagist.org:443
            getcomposer.org:443
            registry.npmjs.org:443
            nodejs.org:443
            ppa.launchpadcontent.net:443
            ppa.launchpadcontent.net:80
            keyserver.ubuntu.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            pecl.php.net:443

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f  # v2
        with:
          php-version: ${{ matrix.php }}
          # sqlite/mysql/pgsql = suíte de integração cross-engine; dom/mbstring/fileinfo = sanitizers + uploads.
          extensions: dom, mbstring, fileinfo, pdo_sqlite, sqlite3, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Pin flarum/core para a célula da matriz
        run: composer require --no-update "flarum/core:${{ matrix.flarum-core }}"

      - name: Resolver dependências (composer update)
        run: composer update --no-interaction --no-progress --prefer-stable --no-scripts

      - name: PHPUnit (Unit + Integration)
        env:
          AVOCADO_TEST_MYSQL: host=127.0.0.1;port=3306;username=root;password=root;database=avocado_test
          AVOCADO_TEST_PGSQL: host=127.0.0.1;port=5432;username=postgres;password=postgres;database=avocado_test
        run: composer test

      - name: Lint PHP (php -l)
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find src migrations extend.php -name '*.php' -print0 2>/dev/null)
          [ "${#files[@]}" -gt 0 ] || { echo "Nenhum arquivo PHP encontrado"; exit 1; }
          printf '%s\0' "${files[@]}" | xargs -0 -n1 -P4 php -l

      # §35.13 R2 — Packagist security advisories.
      - name: composer audit
        run: composer audit --no-dev --format=plain

      # §35.13 R3 — PHPStan nível 5 com baseline versionado (phpstan.neon +
      # phpstan-baseline.neon). phpstan/phpstan já vem via require-dev, então
      # `composer analyse` basta. Bloqueante: o baseline mantém verde e novos
      # achados reprovam o PR (aperte o nível/baseline com o tempo).
      - name: PHPStan
        if: matrix.php == '8.3' && matrix.flarum-core == '^2.0.0'
        run: composer analyse

  js:
    name: JS (typecheck, format, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 🟡 §35.13/I3 — egress em `audit` (fase 1: registra os destinos, não
      # bloqueia). A allowed-endpoints abaixo é a lista candidata para quando
      # promover a `block` — antes, revise o resumo do harden-runner do run e
      # ajuste-a aos destinos reais.
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5  # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            packagist.org:443
            repo.packagist.org:443
            getcomposer.org:443
            registry.npmjs.org:443
            nodejs.org:443
            ppa.launchpadcontent.net:443
            ppa.launchpadcontent.net:80
            keyserver.ubuntu.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            pecl.php.net:443

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Composer + PHP necessários para resolver os typings do core
      # (js/tsconfig importa flarum/* via ../vendor/flarum/core/js/dist-typings/*).
      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f  # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache do composer
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Instalar dependências PHP (para os typings do core)
        # composer update (em vez de install) porque a extensão é uma
        # lib e mantém composer.lock no .gitignore.
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: js/package-lock.json

      - name: Instalar dependências JS
        working-directory: js
        run: npm ci

      - name: Verificar formatação (Prettier)
        working-directory: js
        run: npm run format-check

      - name: Type-check (TypeScript)
        working-directory: js
        run: npm run check-typings

      - name: Build (webpack production)
        working-directory: js
        run: npm run build

      # §35.13 R2 — npm advisories. --audit-level=high reduz ruído de
      # transitivas dev; subir para moderate quando o baseline estabilizar.
      - name: npm audit
        working-directory: js
        run: npm audit --audit-level=high

  # §35.13 I1 — bloqueia PRs que introduzam dependências com CVEs conhecidos.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      # 🟡 §35.13/I3 — egress em `audit` (fase 1: registra os destinos, não
      # bloqueia). A allowed-endpoints abaixo é a lista candidata para quando
      # promover a `block` — antes, revise o resumo do harden-runner do run e
      # ajuste-a aos destinos reais.
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5  # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            packagist.org:443
            repo.packagist.org:443
            getcomposer.org:443
            registry.npmjs.org:443
            nodejs.org:443
            ppa.launchpadcontent.net:443
            ppa.launchpadcontent.net:80
            keyserver.ubuntu.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            pecl.php.net:443

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

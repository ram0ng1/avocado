name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Default-deny do GITHUB_TOKEN (CLAUDE.md §35.13 C1). Jobs declaram o
# que precisam.
permissions: {}

# Evita corridas redundantes no mesmo PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Valida o composer.json as-committed (antes de qualquer mutacao por
  # matriz). --strict reprova constraints exatas; por isso este passo
  # tem que rodar fora da matriz que pin a flarum/core em 2.x-dev.
  composer-validate:
    name: composer validate (--strict)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f  # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validar composer.json
        # O composer.json NÃO tem campo "version": a versão dos releases é
        # derivada das tags git (ver release-management.yml). --no-check-publish
        # evita falso-positivo de requisitos de publicação; demais warnings
        # continuam fatais.
        run: composer validate --strict --no-check-publish

  php:
    name: PHP ${{ matrix.php }} × flarum/core ${{ matrix.flarum-core }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # flarum/core 2.x requer php ^8.3 — 8.2 ficou de fora.
        php: ['8.3', '8.4']
        # §35.13 I5 — testa contra a versão estável E a HEAD do core.
        flarum-core:
          - '^2.0.0'
          - '2.x-dev'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f  # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Pin flarum/core para a célula da matriz
        run: composer require --no-update "flarum/core:${{ matrix.flarum-core }}"

      - name: Resolver dependências (composer update)
        run: composer update --no-interaction --no-progress --prefer-stable --no-scripts

      - name: Lint PHP (php -l)
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find src migrations extend.php -name '*.php' -print0 2>/dev/null)
          [ "${#files[@]}" -gt 0 ] || { echo "Nenhum arquivo PHP encontrado"; exit 1; }
          printf '%s\0' "${files[@]}" | xargs -0 -n1 -P4 php -l

      # §35.13 R2 — Packagist security advisories.
      - name: composer audit
        run: composer audit --no-dev --format=plain

      # §35.13 R3 — PHPStan com flarum/phpstan-stub. continue-on-error: true
      # porque é a primeira adoção; reduzir conforme baseline melhora.
      - name: PHPStan (audit-only)
        if: matrix.php == '8.3' && matrix.flarum-core == '^2.0.0'
        continue-on-error: true
        run: |
          composer require --dev --no-progress "phpstan/phpstan:^1" "flarum/phpstan-stub:*"
          vendor/bin/phpstan analyse --level=5 --no-progress src/ extend.php

  js:
    name: JS (typecheck, format, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Composer + PHP necessários para resolver os typings do core
      # (js/tsconfig importa flarum/* via ../vendor/flarum/core/js/dist-typings/*).
      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f  # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache do composer
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Instalar dependências PHP (para os typings do core)
        # composer update (em vez de install) porque a extensão é uma
        # lib e mantém composer.lock no .gitignore.
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: js/package-lock.json

      - name: Instalar dependências JS
        working-directory: js
        run: npm ci

      - name: Verificar formatação (Prettier)
        working-directory: js
        run: npm run format-check

      - name: Type-check (TypeScript)
        working-directory: js
        run: npm run check-typings

      - name: Build (webpack production)
        working-directory: js
        run: npm run build

      # §35.13 R2 — npm advisories. --audit-level=high reduz ruído de
      # transitivas dev; subir para moderate quando o baseline estabilizar.
      - name: npm audit
        working-directory: js
        run: npm audit --audit-level=high

  # §35.13 I1 — bloqueia PRs que introduzam dependências com CVEs conhecidos.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
